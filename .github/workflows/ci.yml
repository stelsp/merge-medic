name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -S warning watch.sh fix-mr.sh lib.sh bin/mrwatch install.sh uninstall.sh
      - name: bash -n
        run: |
          for f in watch.sh fix-mr.sh lib.sh bin/mrwatch install.sh uninstall.sh; do
            bash -n "$f"
          done

  mrtop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build + vet
        run: |
          make build
          go vet ./...
